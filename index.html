      els.messages.innerHTML = `<div class="welcome ${!isConnected ? 'disconnected' : ''}" id="welcome">
        <div class="welcome-container">
          <div class="welcome-text">

          </div>
          <div class="system-status" id="systemStatus" data-state="idle" aria-live="polite" hidden></div>
        </div>

    function getSystemStatusElement() {
      let status = document.getElementById('systemStatus');
      if (!status) {
        status = document.createElement('div');
        status.id = 'systemStatus';
        status.className = 'system-status';
        status.dataset.state = 'idle';
        status.setAttribute('aria-live', 'polite');
        status.hidden = true;
      }
      return status;
    }

    function renderMessage(role, content, fileAttachments, displayText) {
      document.body.classList.remove('chat-empty');
      $('#welcome')?.remove();
      const row = document.createElement('article');
      row.className = `message-row ${role === 'user' ? 'user' : 'assistant'}`;
      const contentWrap = document.createElement('div');
      contentWrap.className = 'message-content';
      const bubble = document.createElement('div');
      bubble.className = 'message-bubble';

      let displayContent = '';
      if (role === 'user') {
        if (displayText !== undefined && displayText !== null) {
          displayContent = String(displayText).trim();
        } else {
          // Limpa transcrições e blocos técnicos caso venha de histórico anterior
          const raw = Array.isArray(content)
            ? (content.find(part => part.type === 'text')?.text || '')
            : String(content ?? '');
          displayContent = raw
            .replace(/\n*\[Arquivo anexado:[\s\S]*?```[\s\S]*?```/gi, '')
            .replace(/\n*\[Imagem anexada:[\s\S]*?(?=\n\n\[|$)/gi, '')
            .trim();
        }
      } else {
        displayContent = Array.isArray(content)
          ? (content.find(part => part.type === 'text')?.text || '')
          : String(content ?? '');
      }

      bubble.dataset.raw = displayContent;
      let attachHtml = '';
      if (role === 'user' && fileAttachments && fileAttachments.length) {
        attachHtml = fileAttachments.map(file =>
          file.kind === 'image'
            ? `<div class="attach-inline"><img src="${file.dataUrl}" alt="${escapeHtml(file.name)}"><span>${escapeHtml(file.name)}</span></div>`
            : `<div class="attach-inline"><span>${escapeHtml(file.name)}</span></div>`
        ).join('') + '<div style="clear:both"></div>';
      }
      bubble.innerHTML = attachHtml + (displayContent ? formatMessage(displayContent) : '');
      contentWrap.append(bubble);

      if (role === 'assistant') {
        const rowInner = document.createElement('div');
        rowInner.className = 'message-row-inner';
        rowInner.append(contentWrap, getSystemStatusElement());
        row.append(rowInner);
        els.messages.append(row);
      } else {
        row.append(contentWrap);
        els.messages.append(row);
      }

      return bubble;
    }

    function ensureStreamingBubble() {
      if (streamingBubble) return streamingBubble;
      const bubble = renderMessage('assistant', '');
      streamingBubble = bubble;
      bubble.innerHTML = '';
      return bubble;
    }

    // Detecta se a mensagem do usuário provavelmente está pedindo um arquivo para
    // download (Word, Excel, PPT, código, etc.). Usado para só incluir a instrução de
    // formatação de arquivo no prompt de sistema quando ela é relevante — em vez de
    // pagar esse token em toda mensagem, mesmo nas puramente conversacionais.
    // Estratégia: extensão de arquivo mencionada já basta; senão, exige um verbo de ação
    // (gerar/criar/exportar/baixar/etc.) perto de uma palavra de artefato (documento,
    // planilha, apresentação, word, excel...) para evitar falso positivo tipo "crie uma
    // rotina de exercícios" ou "isso me gera confiança".
    const FILE_EXT_HINT = /\b(pdf|docx?|xlsx?|pptx?|csv)\b/i;
    const FILE_ARTIFACT_WORD = /(arquivo|documento|planilha|apresenta[cç][aã]o|slides?|c[oó]digo|script|word|excel|powerpoint)/i;
    const FILE_ACTION_WORD = /(ger[ae]|gerar|cri[ae]|criar|fa[cç]a|faz|fazer|export[ae]|exportar|baix[ae]|baixar|salv[ae]|salvar|mont[ae]|montar)/i;

    function wantsFileGeneration(text) {
      if (!text) return false;
      const t = text.toLowerCase();
      if (FILE_EXT_HINT.test(t)) return true;
      const words = t.split(/\s+/);
      for (let i = 0; i < words.length; i++) {
        if (FILE_ACTION_WORD.test(words[i])) {
          const from = Math.max(0, i - 4);
          const to = Math.min(words.length - 1, i + 4);
          for (let j = from; j <= to; j++) {
            if (FILE_ARTIFACT_WORD.test(words[j])) return true;
          }
        }
      }
      return false;
    }

    function buildSystemPrompt(settings, userText) {
      const userInstructions = settings.personality ? `\n\n[INSTRUÇÕES DO USUÁRIO]:\n${settings.personality}` : '';
      const userCall = settings.userName ? `\n- O usuário se chama "${settings.userName}".` : '';
      const dateStr = new Intl.DateTimeFormat('pt-BR', { dateStyle: 'full' }).format(new Date());

      const fileInstruction = wantsFileGeneration(userText)
        ? '\n- Para gerar arquivos para download (Word, Excel, PPT, códigos, etc.), utilize blocos de código markdown com a extensão correspondente (```word, ```xlsx, ```pptx, ```txt, ```html, etc.).'
        : '';

      return `Você é Aion, um assistente de IA pessoal inteligente em português do Brasil (pt-BR).
- Contexto temporal de referência: ${dateStr}.${fileInstruction}${userCall}${userInstructions}`;
    }

    function isWindowOutOfFocus() {
      try {
        if (window.AndroidBridge && window.AndroidBridge.isAppBackgrounded && window.AndroidBridge.isAppBackgrounded()) return true;
        return document.hidden || document.visibilityState === 'hidden' || !document.hasFocus();
      } catch { return false; }
    }

    function cleanNotificationText(raw) {
      if (!raw) return 'Resposta concluída.';
      let text = String(raw);
      text = text.replace(/<think>[\s\S]*?(?:<\/think>|$)/gi, '');
      text = text.replace(/<thought>[\s\S]*?(?:<\/thought>|$)/gi, '');
      text = text.replace(/<reasoning>[\s\S]*?(?:<\/reasoning>|$)/gi, '');
      text = text.replace(/```[\s\S]*?```/g, '[Código]');
      text = text.replace(/!\[.*?\]\(.*?\)/g, '');
      text = text.replace(/\[([^\]]+)\]\(.*?\)/g, '$1');
      text = text.replace(/^#{1,6}\s+(.+)$/gm, '$1: ');
      text = text.replace(/[*_`~]/g, '');
      text = text.replace(/^[*-+]\s+/gm, '');
      text = text.replace(/\s+/g, ' ').trim();
      if (text.length > 150) {
        text = text.slice(0, 147) + '...';
      }
      return text || 'Resposta concluída.';
    }

    function updateSendButtonState() {
      const sendBtn = document.getElementById('sendButton');
      const inputEl = document.getElementById('messageInput');
      if (!sendBtn) return;

      if (busy) {
        sendBtn.disabled = false;
        sendBtn.classList.add('stop-mode');
        sendBtn.setAttribute('aria-label', 'Parar resposta (Esc)');
        sendBtn.setAttribute('title', 'Parar resposta (Esc)');
        sendBtn.innerHTML = '<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
        sendBtn.style.opacity = '1';
        sendBtn.style.cursor = 'pointer';
        sendBtn.style.pointerEvents = 'auto';
        return;
      }

      sendBtn.classList.remove('stop-mode');
      sendBtn.setAttribute('aria-label', 'Enviar mensagem');
      sendBtn.setAttribute('title', 'Enviar mensagem');
      sendBtn.innerHTML = '<svg viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>';

      const hasText = !!(inputEl && inputEl.value && inputEl.value.trim().length > 0);
      const hasAtt = !!(typeof attachments !== 'undefined' && attachments && attachments.length > 0);

      sendBtn.disabled = false;
      if (!hasText && !hasAtt) {
        sendBtn.style.opacity = '0.35';
        sendBtn.style.cursor = 'not-allowed';
      } else {
        sendBtn.style.opacity = '1';
        sendBtn.style.cursor = 'pointer';
      }
    }

    function restoreSendButton() {
      updateSendButtonState();
    }

    function focusAppWindow() {
      try {
        window.focus();
        if (window.parent && window.parent !== window) window.parent.focus();
        if (window.top && window.top !== window) window.top.focus();
        if (window.chrome && window.chrome.webview && window.chrome.webview.postMessage) {
          window.chrome.webview.postMessage('focus');
        }
        const settings = loadSettings();
        document.title = 'Aion';
      } catch (err) {
        console.warn('Erro ao focar janela:', err);
      }
    }

    function triggerCompletionNotification(title, message) {
      try {
        // 1. Android Native Bridge
        if (window.AndroidBridge && window.AndroidBridge.notifyResponseCompleted) {
          window.AndroidBridge.notifyResponseCompleted(title, message);
          return;
        }

    const IMAGE_TYPES = /\.(png|jpe?g|webp|gif|svg|bmp|ico|tiff?)$/i;
    const TEXT_TYPES = /\.(txt|md|markdown|json|csv|tsv|xml|html|htm|css|js|mjs|cjs|ts|py|java|c|cpp|h|rb|go|rs|php|sql|yml|yaml|toml|env|sh|bat|ps1|r|kt|swift|vue|svelte|jsx|tsx|ipynb|tex|rst|latex|ini|log)$/i;
    const DOCUMENT_TYPES = /\.(pdf|docx|xlsx|xls)$/i;
    const MAX_IMAGE_SIZE = 50 * 1024 * 1024;
    const MAX_TEXT_SIZE = 25 * 1024 * 1024;
    const MAX_PDF_SIZE = 100 * 1024 * 1024;
    const MAX_DOC_SIZE = 50 * 1024 * 1024;

    const MAX_ATTACHMENTS_COUNT = 20;

    function renderAttachmentPreview() {
      const box = $('#attachments');
      const attachBtn = $('#attachBtn');
      if (attachBtn) {
        if (attachments && attachments.length > 0) {
          attachBtn.classList.add('active');
        } else {
          attachBtn.classList.remove('active');
        }
      }
      if (!attachments.length) {
        box.hidden = true;
        box.innerHTML = '';
        return;
      }
      box.hidden = false;
      box.innerHTML = attachments.map((file, index) => `
        <div class="attachment-chip">
          ${file.kind === 'image' ? `<img src="${file.dataUrl}" alt="">` : ''}
          <span class="chip-name" title="${escapeHtml(file.name)}">${escapeHtml(file.name)}</span>
          <button type="button" class="chip-remove" data-index="${index}" aria-label="Remover ${escapeHtml(file.name)}">×</button>
        </div>`).join('');
    }

    async function compressAndResizeImage(file, maxDimension = 1600, quality = 0.85) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let width = img.naturalWidth || img.width || 1;
            let height = img.naturalHeight || img.height || 1;

            if (width > maxDimension || height > maxDimension) {
              if (width > height) {
                height = Math.round((height * maxDimension) / width);
                width = maxDimension;
              } else {
                width = Math.round((width * maxDimension) / height);
                height = maxDimension;
              }
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            const isPng = file.type === 'image/png' || file.name.endsWith('.png');
            // Mantém PNG se for pequeno para preservar transparência, caso contrário converte para JPEG otimizado
            const mimeType = isPng && file.size < 400 * 1024 ? 'image/png' : 'image/jpeg';
            const optimizedDataUrl = canvas.toDataURL(mimeType, quality);

            resolve({
              dataUrl: optimizedDataUrl,
              width,
              height,
              name: file.name,
              kind: 'image'
            });
          };
          img.onerror = () => {
            resolve({
              dataUrl: e.target.result,
              width: 0,
              height: 0,
              name: file.name,
              kind: 'image'
            });
          };
          img.src = e.target.result;
        };
        reader.onerror = () => {
          resolve(null);
        };
        reader.readAsDataURL(file);
      });
    }

    async function extractPdfText(arrayBuffer) {
      if (!window.pdfjsLib) throw new Error('biblioteca de PDF não carregada');
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
      const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      let text = '';
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        const pageText = content.items.map(item => item.str).join(' ').trim();
        if (pageText) {
          text += `--- Página ${i} ---\n` + pageText + '\n\n';
        }
      }
      return cleanExtractedText(text);
    }

    function cleanExtractedText(text) {
      if (!text) return '';
      return String(text)
        .replace(/\r\n/g, '\n')
        .replace(/[ \t]+/g, ' ')
        .replace(/\n{3,}/g, '\n\n')
        .trim();
    }

    async function extractDocxText(arrayBuffer) {
      if (!window.mammoth) throw new Error('biblioteca de DOCX não carregada');
      const result = await window.mammoth.extractRawText({ arrayBuffer });
      return cleanExtractedText(result.value || '');
    }

    function extractSpreadsheetText(arrayBuffer) {
      if (!window.XLSX) throw new Error('biblioteca de planilhas não carregada');
      const workbook = window.XLSX.read(arrayBuffer, { type: 'array' });
      const parts = [];
      for (const name of workbook.SheetNames) {
        const sheet = workbook.Sheets[name];
        const csv = window.XLSX.utils.sheet_to_csv(sheet);
        const rows = csv.split('\n').map(r => r.trim()).filter(Boolean);
        const limited = rows.slice(0, 500).join('\n');
        const note = rows.length > 500 ? `\n...[exibindo primeiras 500 linhas de ${rows.length}]` : '';
        parts.push(`### Planilha: ${name}\n${limited}${note}`.trim());
      }
      return cleanExtractedText(parts.join('\n\n'));
    }

    async function extractDocumentText(file) {
      const buffer = await file.arrayBuffer();
      const lower = file.name.toLowerCase();
      if (lower.endsWith('.pdf')) return await extractPdfText(buffer);
      if (lower.endsWith('.docx')) return await extractDocxText(buffer);
      if (lower.endsWith('.xlsx') || lower.endsWith('.xls')) return extractSpreadsheetText(buffer);
      throw new Error('formato não reconhecido');
    }

    function handleFiles(fileList) {
      const files = Array.from(fileList || []);
      if (attachments.length + files.length > MAX_ATTACHMENTS_COUNT) {
        notify(`Máximo de ${MAX_ATTACHMENTS_COUNT} arquivos por mensagem`);
        return;
      }
      for (const file of files) {
        if (IMAGE_TYPES.test(file.name)) {
          if (file.size > MAX_IMAGE_SIZE) { notify(`${file.name} é muito grande (máx ${Math.round(MAX_IMAGE_SIZE / 1024 / 1024)}MB)`); continue; }
          compressAndResizeImage(file).then(optimizedItem => {
            if (!optimizedItem) return;
            attachments.push(optimizedItem);
            renderAttachmentPreview();
          }).catch(() => {});
        } else if (TEXT_TYPES.test(file.name)) {
          if (file.size > MAX_TEXT_SIZE) { notify(`${file.name} é muito grande (máx ${Math.round(MAX_TEXT_SIZE / 1024 / 1024)}MB)`); continue; }
          const reader = new FileReader();
          reader.onload = () => {
            let text = cleanExtractedText(String(reader.result || ''));
            if (text.length > MAX_EXTRACTED_TEXT) {
              text = text.slice(0, MAX_EXTRACTED_TEXT) + '\n...[conteúdo truncado por limite de tamanho]';
            }
            attachments.push({ kind: 'text', name: file.name, text });
            renderAttachmentPreview();
          };
          reader.readAsText(file);
        } else if (DOCUMENT_TYPES.test(file.name)) {
          const isPdf = /\.pdf$/i.test(file.name);
          const maxSize = isPdf ? MAX_PDF_SIZE : MAX_DOC_SIZE;
          if (file.size > maxSize) { notify(`${file.name} é muito grande (máx ${Math.round(maxSize / 1024 / 1024)}MB)`); continue; }
          extractDocumentText(file).then(rawText => {
            let text = cleanExtractedText(rawText);
            if (text.length > MAX_EXTRACTED_TEXT) {
              text = text.slice(0, MAX_EXTRACTED_TEXT) + '\n...[conteúdo truncado por limite de tamanho]';
            }
            if (!text.trim()) { notify(`${file.name} não tem texto extraível`); return; }
            attachments.push({ kind: 'text', name: file.name, text });
            renderAttachmentPreview();
          }).catch(error => {
            notify(`Não consegui ler ${file.name}: ${error.message || 'erro desconhecido'}`);
          });
        } else {
          notify(`Formato não suportado: ${file.name}`);
        }
      }
    }

    function buildUserContent(text) {
      const images = attachments.filter(file => file.kind === 'image');
      const texts = attachments.filter(file => file.kind === 'text');
      const textParts = [];
      if (text.trim()) textParts.push(text.trim());

      for (const file of texts) {
        textParts.push(`\n[Arquivo anexado: ${file.name}]\n\`\`\`\n${file.text}\n\`\`\``);
      }

      const combinedText = textParts.join('\n\n');

      if (images.length > 0) {
        const parts = [];
        if (combinedText) {
          parts.push({ type: 'text', text: combinedText });
        } else {
          parts.push({ type: 'text', text: 'Analise a(s) imagem(ns) / foto(s) anexada(s).' });
        }
        for (const img of images) {
          parts.push({
            type: 'image_url',
            image_url: { url: img.dataUrl }
          });
        }
        return parts;
      }

      return combinedText;
    }

    function sanitizeHistoryMessageContent(msg) {
      if (msg.role !== 'user') {
        return typeof msg.content === 'string' ? msg.content : (msg.content?.find?.(p => p.type === 'text')?.text || '');
      }

      if (typeof msg.content === 'string') {
        return msg.content;
      }

      if (Array.isArray(msg.content)) {
        const textParts = msg.content.filter(p => p.type === 'text').map(p => p.text).join('\n');
        const hasImages = msg.content.some(p => p.type === 'image_url');
        return hasImages ? `${textParts}\n[Nota: Imagem enviada nesta etapa já processada]` : textParts || '[Mensagem do usuário]';
      }

      return String(msg.content ?? '') || '[Mensagem do usuário]';
    }
    function fetchWithTimeout(url, options = {}, ms = 2500) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), ms);
      if (options.signal) {
        if (options.signal.aborted) controller.abort();
        else options.signal.addEventListener('abort', () => controller.abort());
      }
      if (window.currentAbortSignal) {
        if (window.currentAbortSignal.aborted) controller.abort();
        else window.currentAbortSignal.addEventListener('abort', () => controller.abort());
      }
      return fetch(url, { ...options, signal: controller.signal }).finally(() => clearTimeout(timer));
    }


    async function fetchTavilySearch(query = '', apiKey = '', opts = {}) {
      const q = (query || '').trim();
      if (!q || !apiKey) return [];
      const {
        searchDepth = 'basic',   // 'basic' é mais rápido/barato; só usamos 'advanced' quando vale a pena
        topic = 'general',       // 'news' reordena por recência quando a pergunta é sobre atualidades
        timeRange = null,        // 'day' | 'week' | 'month' | 'year' — restringe por recência real
        maxResults = 6,          // menos resultados, mas mais relevantes = menos ruído no contexto
      } = opts;
      try {
        const body = {
          api_key: apiKey,
          query: q,
          search_depth: searchDepth,
          topic: topic,
          include_answer: true,
          max_results: maxResults,
        };
        if (timeRange) body.time_range = timeRange;

        const res = await fetchWithTimeout('https://api.tavily.com/search', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        }, 12000);
        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          console.warn('Tavily Search API error:', res.status, errData);
          return [];
        }
        const data = await res.json();
        const results = [];
        if (data.answer) {
          results.push({
            title: `Resumo Direto da Web: ${q}`,
            url: 'https://tavily.com',
            snippet: data.answer,
            isTavily: true,
            special: true,
          });
        }
        if (Array.isArray(data.results)) {
          for (const item of data.results) {
            if (item.url && (item.title || item.content)) {
              results.push({
                title: item.title || 'Fonte Web',
                url: item.url,
                snippet: (item.content || '').slice(0, 900),
                score: typeof item.score === 'number' ? item.score : null,
                publishedDate: item.published_date || null,
                isTavily: true,
              });
            }
          }
        }
        return results;
      } catch (err) {
        console.warn('Erro ao consultar Tavily:', err);
        return [];
      }
    }

    async function fetchSerperSearch(query = '', apiKey = '') {

      try {

          results.push({
            title: data.answerBox.title || `Resposta Rápida: ${q}`,
            url: data.answerBox.link || 'https://google.com',
            snippet: data.answerBox.snippet || data.answerBox.answer,
            isSerper: true,
            special: true,
          });
        }
        if (Array.isArray(data.organic)) {
          for (const item of data.organic) {
            if (item.link && (item.title || item.snippet)) {
              results.push({
                title: item.title || 'Resultado Web',
                url: item.link,
                snippet: item.snippet || '',
                isSerper: true,
              });
            }
          }
        }
        return results;
      } catch (err) {
        console.warn('Erro ao consultar Serper:', err);
        return [];
      }
    }

    // Chama o chat/completions do provedor ativo tentando primeiro com o parâmetro de
    // tokens "moderno" (max_completion_tokens, exigido por modelos de raciocínio como
    // GPT-5/o1/o3) e, se a API rejeitar, refaz com o parâmetro legado (max_tokens).
    // Sem isso, o pre-flight de busca falhava em silêncio sempre que o modelo ativo
    // fosse um modelo de raciocínio — a causa raiz de "a busca não dispara mesmo com chave".
    async function callRouterLLM(endpoint, apiKey, modelName, messages, tokenBudget) {
      const basePayload = {
        model: modelName,
        messages,
        temperature: 0.1,
      };
      const attempts = [
        { ...basePayload, max_completion_tokens: tokenBudget },
        { ...basePayload, max_tokens: tokenBudget },
      ];
      for (const payload of attempts) {
        try {
          const res = await fetchWithTimeout(endpoint, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + apiKey,
            },
            body: JSON.stringify(payload),
          }, 8000);
          if (res.ok) {
            const data = await res.json();
            const content = (data.choices?.[0]?.message?.content || '').trim();
            if (content) return content;
            // resposta vazia pode indicar que o modelo consumiu o orçamento em raciocínio;
            // ainda assim não tentamos de novo aqui, deixamos o chamador decidir o fallback.
            return '';
          }
          const errBody = await res.json().catch(() => ({}));
          const msg = (errBody?.error?.message || '').toLowerCase();
          // Se o erro não for especificamente sobre o parâmetro de tokens, não adianta retry.
          if (!msg.includes('max_tokens') && !msg.includes('max_completion_tokens')) {
            console.warn('Router LLM error:', res.status, errBody);
            return '';
          }
          // senão, cai para a próxima tentativa (parâmetro alternativo)
        } catch (err) {
          console.warn('Router LLM call failed:', err);
          return '';
        }
      }
      return '';
    }

    // Análise unificada de intenção de busca: numa única chamada ao LLM, decide SE precisa
    // buscar, REESCREVE a query usando o histórico da conversa (resolvendo referências como
    // "e esse ano?", "e o segundo colocado?"), e classifica o tipo de busca (notícia/geral)
    // e janela de tempo (hoje/semana/mês/sem restrição) para otimizar a chamada ao Tavily.
    // Isso substitui as duas etapas antigas (decideIfSearchIsNeeded + resolveSearchQuery),
    // que eram regex frágeis + uma segunda chamada LLM redundante.
    async function analyzeSearchIntent(query, settings, historyMessages) {
      const fallback = { needsSearch: false, query, topic: 'general', timeRange: null, depth: 'basic' };
      if (!query) return fallback;
      const q = query.trim();
      if (q.length < 2) return fallback;

      const qLower = q.toLowerCase();

      // 1. Saudações e conversas triviais nunca pesquisam (curto-circuito, sem custo de LLM)
      if (/^(oi|ol[aá]|bom dia|boa tarde|boa noite|tudo bem|tudo bom|como vai|e a[ií]|valeu|obrigad[oa]|show|beleza|ok|tchau|at[eé] mais)[!?.,\s]*(tudo bem\??|como vai\??|voc[eê]\??)?$/i.test(qLower) ||
          /^(me\s+conte\s+uma\s+piada|conte\s+uma\s+piada|quem\s+[eé]\s+voc[eê]|qual\s+[eé]\s+o\s+seu\s+nome|o\s+que\s+voc[eê]\s+faz)[!?.,\s]*$/i.test(qLower)) {
        return fallback;
      }

      const searchKey = (settings.webSearchKey || '').trim();
      if (!searchKey) return fallback; // sem chave configurada, não há como buscar

      const currentApiKey = getActiveApiKey(settings);
      const prov = getActiveProviderConfig(settings);

      // 2. Gatilho fatual explícito e óbvio de SIM (economiza a chamada ao LLM em casos claros).
      //    Ainda passamos pelo LLM depois para reescrever a query com contexto, exceto
      //    quando não há como chamar o LLM (sem chave da API principal).
      const factualTriggers = /\b(candidatos?|elei[cç][oõ]es|presid[eê]ncia|governo|tse|not[ií]cias?|manchetes?|acontecimentos?|fatos|tempo|clima|previs[aã]o|temperatura|vai\s+chover|d[oó]lar|euro|bitcoin|btc|eth|cota[cç][aã]o|c[aã]mbio|bolsa|jogos?|placar|tabela|resultado|lan[cç]amentos?|estreias?|filmes?|s[eé]ries?|hoje|ontem|nesta\s+semana|este\s+m[eê]s|202[4-9]|atual|atuais|recentes?|quem\s+[eé]|onde\s+fica|quando\s+vai|quanto\s+custa|pesquise|busque|procure)\b/i;
      const hasObviousTrigger = factualTriggers.test(qLower);

      // 3. Gatilho explícito e óbvio de NÃO: pedidos de código, tradução, matemática,
      //    escrita criativa e teoria imutável quase nunca precisam de busca. Isso evita
      //    gastar uma chamada de LLM inteira só para chegar na resposta "não precisa".
      const obviousNoTriggers = /\b(traduz(a|ir)?|tradu[cç][aã]o|escreva?|escrev[ae]|redija?|crie?\s+um[a]?\s+(poema|hist[oó]ria|texto|conto)|resolva?|calcul[ae]|quanto\s+[eé]\s+\d|explica?|explique|defina?|o\s+que\s+[eé]|como\s+funciona|resuma?|resumo\s+d[eo]|corrija?|revise?|d[eê]\s+exemplos?|me\s+ajuda\s+a\s+entender)\b/i;
      const hasObviousNoTrigger = !hasObviousTrigger && obviousNoTriggers.test(qLower);

      if (hasObviousNoTrigger) {
        return fallback;
      }

      if (!currentApiKey) {
        // Sem LLM disponível para decidir/reescrever, usamos só o gatilho regex puro como antes.
        return hasObviousTrigger ? { ...fallback, needsSearch: true } : fallback;
      }

      // 4. Cache simples em memória: a mesma pergunta (normalizada) feita de novo na mesma
      //    sessão reaproveita a última decisão + resultados de busca, sem rechamar o LLM
      //    roteador nem o Tavily/Serper. TTL é curto para perguntas de urgência temporal
      //    (notícia/hoje) e mais longo para o resto, para não arriscar mostrar dado velho.
      const cacheKey = qLower.replace(/\s+/g, ' ').trim();
      const cached = searchIntentCache.get(cacheKey);
      if (cached && (Date.now() - cached.timestamp) < getSearchCacheTTL(cached.intent)) {
        return cached.intent;
      }

      const endpoint = (settings.apiBase || prov.apiBase || 'https://api.openai.com/v1').replace(/\/$/, '') + '/chat/completions';
      const modelName = (getActiveModel(settings) || '').replace(/^models\//, '');

      // Contexto recente da conversa (só os últimos turnos, texto puro) para permitir
      // reescrever perguntas de seguimento corretamente.
      const recentTurns = (historyMessages || []).slice(-6).map(m => {
        const txt = typeof m.content === 'string' ? m.content : (m.displayText || '');
        return `${m.role === 'user' ? 'Usuário' : 'Assistente'}: ${(txt || '').slice(0, 300)}`;
      }).join('\n');

      const todayStr = new Date().toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' });

      const systemPrompt = `Você é o roteador de busca do Aion. Data de hoje: ${todayStr}.
Analise a última mensagem do usuário (com o histórico como contexto) e responda SOMENTE com um JSON válido, sem texto extra, sem markdown, no formato exato:
{"search": true|false, "query": "string", "topic": "general"|"news", "time_range": null|"day"|"week"|"month"|"year"}

Regras:
- "search": true se a resposta exigir fatos atuais, dados que mudam com o tempo, pessoas/cargos atuais, preços/cotações, notícias, clima, resultados de jogos, ou qualquer coisa que você não tem certeza de saber de cor. false para saudações, criatividade, código, teoria imutável, matemática, tradução.
- "query": se search=true, reescreva a pergunta do usuário como uma query de busca autossuficiente e específica, resolvendo pronomes e referências ao histórico (ex: se o usuário disse "e esse ano?" após falar de eleições, a query deve ser "eleições 2026" e não "e esse ano?"). Se search=false, repita a pergunta original.
- "topic": "news" se for sobre notícias/atualidade/eventos recentes; "general" caso contrário.
- "time_range": "day" se pedir algo de hoje/agora; "week" se for da semana; "month" se for do mês/recente; null se não há restrição temporal clara.`;

      const messages = [
        { role: 'system', content: systemPrompt },
        { role: 'user', content: `Histórico recente:\n${recentTurns || '(sem histórico)'}\n\nÚltima mensagem do usuário: "${q}"` }
      ];

      const raw = await callRouterLLM(endpoint, currentApiKey, modelName, messages, 200);

      if (!raw) {
        // LLM indisponível/erro: cai para o gatilho regex simples como rede de segurança.
        return hasObviousTrigger ? { ...fallback, needsSearch: true } : fallback;
      }

      try {
        const jsonMatch = raw.match(/\{[\s\S]*\}/);
        const parsed = JSON.parse(jsonMatch ? jsonMatch[0] : raw);
        const needsSearch = !!parsed.search || hasObviousTrigger;
        const rewrittenQuery = (typeof parsed.query === 'string' && parsed.query.trim()) ? parsed.query.trim() : q;
        const topic = parsed.topic === 'news' ? 'news' : 'general';
        const timeRange = ['day', 'week', 'month', 'year'].includes(parsed.time_range) ? parsed.time_range : null;
        // Perguntas com janela de tempo curta ou tópico de notícia se beneficiam de busca mais profunda.
        const depth = (topic === 'news' || timeRange === 'day' || timeRange === 'week') ? 'advanced' : 'basic';
        const result = { needsSearch, query: rewrittenQuery, topic, timeRange, depth };
        // Só cacheamos decisões vindas do LLM (as por regex já são instantâneas e não
        // precisam de cache); assim uma repetição da mesma pergunta pula essa chamada.
        cacheSet(searchIntentCache, cacheKey, { intent: result, timestamp: Date.now() });
        return result;
      } catch (err) {
        console.warn('Falha ao interpretar JSON do roteador de busca:', err, raw);
        return hasObviousTrigger ? { ...fallback, needsSearch: true } : fallback;
      }
    }

    async function multiSourceSearch(query, signal, opts = {}) {
      const q = (query || '').trim();
      const settings = loadSettings();
      const searchKey = (settings.webSearchKey || '').trim();
      if (!searchKey) return [];

      const promises = [];
      if (searchKey.startsWith('tvly-')) {
        promises.push(fetchTavilySearch(q, searchKey, opts));
      } else {
        promises.push(fetchTavilySearch(q, searchKey, opts));
        promises.push(fetchSerperSearch(q, searchKey));
      }

      // allSettled: se uma fonte falhar/rejeitar, a outra ainda é aproveitada.
      const settledResults = await Promise.allSettled(promises);
      const flatResults = settledResults
        .filter(r => r.status === 'fulfilled')
        .flatMap(r => r.value || []);

      const seen = new Set();
      const deduped = [];
      for (const item of flatResults) {
        if (!item || !item.url || seen.has(item.url.toLowerCase())) continue;
        seen.add(item.url.toLowerCase());
        deduped.push(item);
      }

      // Prioriza resultados com maior score de relevância do Tavily (quando disponível),
      // mantendo o "resumo direto" (special) sempre no topo.
      deduped.sort((a, b) => {
        if (a.special && !b.special) return -1;
        if (b.special && !a.special) return 1;
        const sa = typeof a.score === 'number' ? a.score : 0;
        const sb = typeof b.score === 'number' ? b.score : 0;
        return sb - sa;
      });

      return deduped.slice(0, 10);
    }

    async function webSearch(query, signal, opts = {}) {
      return await multiSourceSearch(query, signal, opts);
    }

    function buildSearchContext(query, results) {
      if (!results || !results.length) return '';
      const lines = results.map((item) => {
        const dateTag = item.publishedDate ? ` [publicado em: ${item.publishedDate}]` : '';
        return `• ${item.title}${dateTag}:\n  ${item.snippet || '(sem informações)'}\n  (Link: ${item.url || ''})`.trim();
      });
      return `### INFORMAÇÕES ATUALIZADAS EM TEMPO REAL DA WEB:\nTermo pesquisado: "${query}"\n\n${lines.join('\n\n')}\n\n[DIRETIVA DE RESPOSTA]: Use TODOS os fatos relevantes das fontes acima (nomes, números, datas, lugares) — não resuma demais nem omita detalhes importantes só para soar mais natural. Responda de forma direta e humana, integrando esses fatos fluidamente na conversa, mas sem perder informação relevante. NÃO diga "De acordo com a Fonte 1", "Segundo a Fonte 2" mecanicamente. Se as fontes trouxerem informações conflitantes, priorize a mais recente e sinalize a divergência brevemente. Essas informações vieram de uma busca real feita agora mesmo — trate-as como confiáveis e correntes, não como algo a ser posto em dúvida depois. Responda como um assistente pessoal inteligente e agradável.`;
    }

    // Gera uma nota compacta (fatos + fontes) para ficar salva no histórico PERMANENTE
    // da conversa. Sem isso, o contexto de busca só existia na hora da resposta e sumia
    // logo em seguida — nos turnos seguintes a IA não tinha mais nenhum rastro de que uma
    // busca real havia sido feita, o que a levava a duvidar da própria resposta anterior.
    function buildSearchMemoryNote(query, results) {
      if (!results || !results.length) return '';
      const topResults = results.slice(0, 5);
      const lines = topResults.map((item) => {
        const dateTag = item.publishedDate ? ` (${item.publishedDate})` : '';
        const snippet = (item.snippet || '').slice(0, 220);
        return `- ${item.title}${dateTag}: ${snippet} [${item.url || 'sem link'}]`;
      });
      return `\n\n[BUSCA WEB REALIZADA para "${query}" — use como fato confirmado se perguntado novamente]:\n${lines.join('\n')}`;
    }

    // Anexa a nota de busca ao conteúdo que será salvo no histórico permanente da
    // conversa (não ao que aparece na tela — displayText continua limpo para o usuário).
    function attachSearchMemoryToContent(content, memoryNote) {
      if (!memoryNote) return content;
      if (typeof content === 'string') {
        return content + memoryNote;
      }
      if (Array.isArray(content)) {
        return [...content, { type: 'text', text: memoryNote }];
      }
      return content;
    }

    async function sendMessage() {
      const inputEl = document.getElementById('messageInput');
      if (!inputEl) return;
      const text = inputEl.value.trim();
      const attLen = typeof attachments !== 'undefined' && attachments ? attachments.length : 0;
      if ((!text && !attLen) || busy) return;
      const settings = loadSettings();
      const currentApiKey = getActiveApiKey(settings);
      const prov = getActiveProviderConfig(settings);
      if (!currentApiKey) {
        notify(`Configure sua chave da API ${prov.name} nas Configurações`);
        openSettings();
        return;
      }

      const userContent = buildUserContent(text);
      const sentAttachments = attachments.map(a => ({
        name: a.name,
        kind: a.kind,
        dataUrl: a.kind === 'image' ? a.dataUrl : '',
      }));
      haptic('medium');
      renderMessage('user', userContent, sentAttachments, text);
      els.input.value = '';
      autoResize();
      attachments = [];
      renderAttachmentPreview();
      busy = true;
      try { window.AndroidBridge?.startKeepAlive?.(); } catch {}
      const abort = new AbortController();
      abortController = abort;
      if (els.send) {
        els.send.disabled = false;
        els.send.classList.add('stop-mode');
        els.send.setAttribute('aria-label', 'Parar resposta (Esc)');
        els.send.setAttribute('title', 'Parar resposta (Esc)');
        els.send.innerHTML = '<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
      }
      const bubble = ensureStreamingBubble();
      userScrolledUp = false;
      scrollToBottom(true);
      setSystemState('thinking');

      let systemContent = buildSystemPrompt(settings, text);
      lastSearchResults = [];

      let searchContext = '';
      let searchMemoryNote = ''; // fica salvo no histórico permanente, ao contrário do searchContext
      const intent = await analyzeSearchIntent(text, settings, conversation);
      if (intent.needsSearch) {
        if (abort.signal.aborted) throw new DOMException('Aborted', 'AbortError');
        setSystemState('searching');
        try {
          window.currentAbortSignal = abort.signal;
          // Reaproveita resultados de busca já obtidos há pouco para a mesma query
          // reescrita, evitando gastar créditos do Tavily/Serper à toa em repetições.
          // TTL curto para tópicos de urgência temporal (notícia/hoje), mais longo pro resto.
          const resultsCacheKey = intent.query.trim().toLowerCase();
          const cachedResults = searchResultsCache.get(resultsCacheKey);
          let results;
          if (cachedResults && (Date.now() - cachedResults.timestamp) < getSearchCacheTTL(intent)) {
            results = cachedResults.results;
          } else {
            results = await webSearch(intent.query, abort.signal, {
              topic: intent.topic,
              timeRange: intent.timeRange,
              searchDepth: intent.depth,
            });
            if (results && results.length) {
              cacheSet(searchResultsCache, resultsCacheKey, { results, timestamp: Date.now() });
            }
          }
          if (abort.signal.aborted) throw new DOMException('Aborted', 'AbortError');
          if (results && results.length) {
            lastSearchResults = results;
            searchContext = buildSearchContext(intent.query, results);
            searchMemoryNote = buildSearchMemoryNote(intent.query, results);
            systemContent += `\n\n${searchContext}`;
          }
        } catch (err) {
          if (err.name === 'AbortError' || abort.signal.aborted) throw err;
          console.warn('Busca web automática falhou:', err);
        }
        if (abort.signal.aborted) throw new DOMException('Aborted', 'AbortError');
        setSystemState('thinking');
      }

      let requestMessages = [{ role: 'system', content: systemContent }];

      // Histórico natural da conversa, limitado às últimas N mensagens para não gastar
      // token à toa em conversas longas (o histórico completo continua salvo no app).
      const recentConversation = conversation.length > MAX_HISTORY_MESSAGES_FOR_API
        ? conversation.slice(-MAX_HISTORY_MESSAGES_FOR_API)
        : conversation;
      const cleanHistory = [];
      let lastRole = '';
      for (let i = 0; i < recentConversation.length; i++) {
        const msg = recentConversation[i];
        const sanitized = sanitizeHistoryMessageContent(msg);
        if (msg.role === lastRole && cleanHistory.length > 0) {
          if (typeof cleanHistory[cleanHistory.length - 1].content === 'string') {
            cleanHistory[cleanHistory.length - 1].content += `\n\n${sanitized}`;
          }
        } else {
          cleanHistory.push({ role: msg.role, content: sanitized });
          lastRole = msg.role;
        }
      }

      // Adiciona a mensagem atual do usuário com o conteúdo integral e o contexto de busca
      let apiUserContent = userContent;
      if (searchContext) {
        if (typeof userContent === 'string') {
          apiUserContent = `${searchContext}\n\n### Pergunta do Usuário:\n${userContent}`;
        } else if (Array.isArray(userContent)) {
          apiUserContent = [{ type: 'text', text: `${searchContext}\n\n### Pergunta do Usuário:` }, ...userContent];
        }
      }

      cleanHistory.push({ role: 'user', content: apiUserContent });
      requestMessages = requestMessages.concat(cleanHistory);

      let answer = '';

      const modelName = (getActiveModel(settings) || '').replace(/^models\//, '');
      if (!modelName) {
        notify('Por favor, habilite e selecione um modelo nas Configurações.');
        openSettings();
        return;
      }
      const endpoint = (settings.apiBase || prov.apiBase || 'https://api.openai.com/v1').replace(/\/$/, '') + '/chat/completions';
      const reqHeaders = {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${currentApiKey}`
      };

      const reqBodyObj = {
        model: modelName,
        messages: requestMessages,
        max_completion_tokens: 16384,
        stream: true,
      };

      let reqBody = JSON.stringify(reqBodyObj);

      let response = null;
      let lastErrorStatus = 0;
      let lastErrorDetail = '';
      let animFrameId = null;
      let displayedAnswer = '';
      let pendingAnswer = '';

      try {
        for (let attempt = 0; attempt < 3; attempt++) {
          try {
            response = await fetch(endpoint, {
              method: 'POST',
              headers: reqHeaders,
              body: reqBody,
              signal: abort.signal,
            });

            if (response.ok) break;

            lastErrorStatus = response.status;
            try {
              const errJson = await response.json();
              const errObj = Array.isArray(errJson) ? errJson[0] : errJson;
              lastErrorDetail = errObj?.error?.message || errObj?.message || '';
            } catch {}

            if (response.status === 503 || response.status === 429) {
              if (attempt < 2) {
                await new Promise(resolve => setTimeout(resolve, 1500 * (attempt + 1)));
                continue;
              }
            } else {
              break;
            }
          } catch (e) {
            if (e.name === 'AbortError' || abort.signal.aborted) throw e;
            if (attempt < 2) {
              await new Promise(resolve => setTimeout(resolve, 1000));
              continue;
            }
          }
        }

        if (!response || !response.ok) {
          const status = lastErrorStatus || response?.status || 500;
          let message = `Não consegui responder (erro ${status}${lastErrorDetail ? ': ' + lastErrorDetail : ''}).`;
          if (status === 503) message = `O modelo "${modelName}" está temporariamente sobrecarregado (erro 503${lastErrorDetail ? ': ' + lastErrorDetail : ''}). Aguarde alguns instantes ou selecione outro modelo nas Configurações.`;
          if (status === 429) message = `Limite de requisições atingido (erro 429${lastErrorDetail ? ': ' + lastErrorDetail : ''}). Aguarde alguns instantes.`;
          if (status === 401) message = `Chave da API inválida (${status}). Verifique nas Configurações.`;
          if (status === 402) message = `Saldo insuficiente na sua conta (${status}). Verifique nas Configurações.`;
          if (status === 404) message = `Modelo "${modelName}" não encontrado (${status}). Escolha outro modelo nas Configurações.`;
          throw new Error(message);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        let streamEnded = false;
        let writingStateStarted = false;
        let lastRenderTime = 0;
        let lastHapticTick = 0;

        const updateBubble = (includeCursor = true) => {
          bubble.dataset.raw = displayedAnswer;
          let html = formatMessage(displayedAnswer);
          if (includeCursor) {
            const cursorHtml = '<span class="typing-cursor"></span>';
            const lastClosingTagRegex = /(<\/(?:p|li|h[1-6]|code|td|div|details)>)\s*$/i;
            if (lastClosingTagRegex.test(html)) {
              html = html.replace(lastClosingTagRegex, `${cursorHtml}$1`);
            } else {
              html += cursorHtml;
            }
          }
          bubble.innerHTML = html;
          scrollToBottom();
        };

        const processTyping = () => {
          animFrameId = null;
          if (pendingAnswer.length > 0) {
            const isHidden = document.hidden || document.visibilityState === 'hidden';
            const len = pendingAnswer.length;
            let chunkSize = 1;
            if (isHidden) chunkSize = len;
            else if (len > 120) chunkSize = Math.ceil(len / 4);
            else if (len > 60) chunkSize = 6;
            else if (len > 25) chunkSize = 4;
            else if (len > 8) chunkSize = 2;
            else chunkSize = 1;

            const toAdd = pendingAnswer.slice(0, chunkSize);
            pendingAnswer = pendingAnswer.slice(chunkSize);
            displayedAnswer += toAdd;

            const now = performance.now();
            if (now - lastRenderTime >= 32 || pendingAnswer.length === 0 || isHidden) {
              lastRenderTime = now;
              updateBubble();
              if (now - lastHapticTick >= 85) {
                lastHapticTick = now;
                haptic('tick');
              }
            }
          }

          if (pendingAnswer.length > 0 || !streamEnded) {
            const isHidden = document.hidden || document.visibilityState === 'hidden';
            if (isHidden) {
              animFrameId = setTimeout(processTyping, 20);
            } else {
              animFrameId = requestAnimationFrame(processTyping);
            }
          } else {
            animFrameId = null;
            updateBubble();
            if (scrollContainer) {
              scrollContainer.removeEventListener('scroll', onUserScroll);
              scrollContainer.removeEventListener('wheel', onUserScroll);
              scrollContainer.removeEventListener('touchmove', onUserScroll);
            }
          }
        };

        const enqueueText = (text) => {
          if (!writingStateStarted) {
            writingStateStarted = true;
            setSystemState('writing');
          }
          answer += text;
          pendingAnswer += text;
          if (!animFrameId) {
            const isHidden = document.hidden || document.visibilityState === 'hidden';
            if (isHidden) {
              animFrameId = setTimeout(processTyping, 20);
            } else {
              animFrameId = requestAnimationFrame(processTyping);
            }
          }
        };

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop() || '';
          for (const line of lines) {
            const trimmed = line.trim();
            if (!trimmed.startsWith('data:')) continue;
            const data = trimmed.slice(5).trim();
            if (data === '[DONE]') continue;
            try {
              const json = JSON.parse(data);
              let piece = '';

              if (json.type === 'content_block_delta' && json.delta) {
                piece = json.delta.text || json.delta.content || '';
              } else if (json.type === 'message_delta' && json.delta) {
                piece = json.delta.text || '';
              } else {
                const delta = json.choices?.[0]?.delta || json.choices?.[0]?.message || json.delta || {};
                if (delta.image) {
                  const imgUrl = delta.image.url || (delta.image.b64_json ? ('data:image/png;base64,' + delta.image.b64_json) : '');
                  if (imgUrl) piece = '\n\n![Imagem gerada](' + imgUrl + ')\n\n';
                } else if (typeof delta.content === 'string') {
                  piece = delta.content;
                } else if (typeof delta.text === 'string') {
                  piece = delta.text;
                } else if (Array.isArray(delta.content)) {
                  piece = delta.content.map(p => typeof p === 'string' ? p : (p.text || (p.image_url?.url ? ('\n\n![Imagem gerada](' + p.image_url.url + ')\n\n') : ''))).join('');
                } else if (typeof json.choices?.[0]?.text === 'string') {
                  piece = json.choices[0].text;
                }
              }

              if (piece) {
                enqueueText(piece);
              }
            } catch (err) {
              console.warn('Chunk de streaming ignorado (JSON inválido):', err);
            }
          }
        }

        streamEnded = true;

        // Aguarda a fila de digitação esvaziar de forma suave
        const maxWaitMs = 1500;
        const waitStart = performance.now();
        while (pendingAnswer.length > 0 && (performance.now() - waitStart) < maxWaitMs) {
          await new Promise(resolve => setTimeout(resolve, 20));
        }

        if (animFrameId) {
          cancelAnimationFrame(animFrameId);
          animFrameId = null;
        }

        if (pendingAnswer.length > 0) {
          displayedAnswer += pendingAnswer;
          pendingAnswer = '';
        }

        if (!answer) answer = 'Não recebi uma resposta válida do modelo.';

        const wantsSources = /\b(fontes?|links?|sites?|refer[eê]ncias?|de\s+onde|onde\s+(?:leu|viu|achou|encontrou)|cite\s+as\s+fontes|quais\s+(?:os\s+)?links|com\s+links|com\s+fontes)\b/i.test(text);

        if (wantsSources && lastSearchResults && lastSearchResults.length) {
          const sources = lastSearchResults.map(item =>
            `<a href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.title)}</a>`
          ).join('');
          bubble.innerHTML = formatMessage(answer) + `<div class="search-sources"><div class="search-sources-title">Fontes consultadas:</div><div class="search-sources-list">${sources}</div></div>`;
        } else {
          bubble.innerHTML = formatMessage(answer);
        }
        bubble.dataset.raw = answer;
      } catch (error) {
        if (typeof animFrameId !== 'undefined' && animFrameId) {
          cancelAnimationFrame(animFrameId);
          animFrameId = null;
        }

        if (error.name === 'AbortError' || abort?.signal?.aborted) {
          const partial = (answer || displayedAnswer || pendingAnswer || '').trim();
          if (partial) {
            bubble.dataset.raw = partial;
            bubble.innerHTML = formatMessage(partial);
            conversation.push({ role: 'user', content: attachSearchMemoryToContent(userContent, searchMemoryNote), displayText: text, fileAttachments: sentAttachments });
            conversation.push({ role: 'assistant', content: partial });
            saveCurrentChat();
          } else {
            bubble.dataset.raw = '*(Resposta interrompida)*';
            bubble.innerHTML = '<p class="interrupted-text">Resposta interrompida</p>';
            conversation.push({ role: 'user', content: attachSearchMemoryToContent(userContent, searchMemoryNote), displayText: text, fileAttachments: sentAttachments });
            conversation.push({ role: 'assistant', content: '*(Resposta interrompida)*' });
            saveCurrentChat();
          }
          finishResponse();
          return;
        }

        bubble.innerHTML = `<p>${escapeHtml(error.message)}</p>`;
        notify(error.message);
        finishResponse();
        return;
      }

      conversation.push({ role: 'user', content: attachSearchMemoryToContent(userContent, searchMemoryNote), displayText: text, fileAttachments: sentAttachments });
      conversation.push({ role: 'assistant', content: answer });
      saveCurrentChat();
      finishResponse();
    }

    // Util central para extrair a mensagem de erro do corpo de uma resposta HTTP não-ok.
    // Evita repetir em cada função de API o mesmo padrão de "tenta parsear JSON,
    // se falhar usa uma mensagem padrão". Cobre tanto err.error.message quanto err.message.
    async function extractApiErrorMessage(response, fallbackMsg) {
      try {
        const err = await response.json();
        return err?.error?.message || err?.message || fallbackMsg;
      } catch {
        return fallbackMsg;
      }
    }

    async function fetchDeepSeekBalance(key) {
      if (!key) return null;
      const response = await fetch('https://api.deepseek.com/user/balance', {
        headers: {
          'Authorization': `Bearer ${key}`,
          'Accept': 'application/json',
        },
      });
      if (!response.ok) {
        if (response.status === 401) {
          throw new Error('Chave da API DeepSeek inválida ou não autorizada');
        }
        const msg = await extractApiErrorMessage(response, `Erro ao consultar saldo (${response.status})`);
        throw new Error(msg);
      }
      return await response.json();
    }

          const total = parseFloat(info.total_balance || 0).toFixed(2);
          htmlStr += '<div class="balance-item"><div class="balance-item-top"><span class="balance-item-currency">Saldo e limites</span><a href="https://platform.deepseek.com/top_up" target="_blank" rel="noopener noreferrer" style="color:var(--text-accent, #60a5fa); text-decoration:none; font-size:14.3px; font-weight:600; display:inline-flex; align-items:center; gap:4px;">' + symbol + total + '</a></div></div>';

    async function fetchOpenAIStatus(key) {
      if (!key) return null;
      const response = await fetch('https://api.openai.com/v1/models', {
        headers: {
          'Authorization': 'Bearer ' + key,
        },
      });
      if (response.ok) {

    async function loadBalanceForProvider(providerId, key) {
      const container = $('#balanceBody');
      if (!container) return;
      const prov = PROVIDERS[providerId] || PROVIDERS.openai;

      if (!key) {
        renderBalance(providerId, null);
        return;
      }

      const seq = ++liveBalanceSeq;
      renderBalance(providerId, null, true);

      try {
        const data = providerId === 'deepseek'
          ? await fetchDeepSeekBalance(key)
          : await fetchOpenAIStatus(key);
        if (seq !== liveBalanceSeq) return;
        renderBalance(providerId, data);
      } catch (err) {
        if (seq !== liveBalanceSeq) return;
        renderBalance(providerId, null, false, err.message || ('Não foi possível validar a chave da ' + prov.name));
      }
    }

    let liveModelSeq = 0;
    let liveModelTimer = null;
    let allDiscoveredModels = [];
    let checkedModelIds = new Set();

    async function fetchAvailableModels(key) {
      if (!key) return [];
      try {
        const headers = { 'Authorization': 'Bearer ' + key };
        const response = await fetch('https://api.openai.com/v1/models', { headers });
        if (!response.ok) return [];
        const data = await response.json();
        const rawItems = Array.isArray(data.data) ? data.data : [];

        const cleanIds = rawItems.map(item => {
          return typeof item === 'string' ? item : (item.id || '');
        }).filter(Boolean);

        const unique = Array.from(new Set(cleanIds));
        unique.sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));
        return unique;
      } catch {
        return [];
      }
    }

    function renderFilteredModels() {
      const container = $('#modelsChecklistContainer');
      const badge = $('#modelsCountBadge');
      const filterInput = $('#modelFilterInput');
      if (!container) return;

      const q = (filterInput?.value || '').trim().toLowerCase();
      let matched = allDiscoveredModels;
      if (q) {
        matched = allDiscoveredModels.filter(m => m.toLowerCase().includes(q));
      }

      if (badge) {
        badge.textContent = checkedModelIds.size + ' ' + (checkedModelIds.size === 1 ? 'selecionado' : 'selecionados');
      }

      if (!matched.length) {
        container.innerHTML = '<div style="padding: 12px; font-size: 13px; color: var(--muted); text-align: center;">Nenhum modelo encontrado.</div>';
        return;
      }

      // Ordena: modelos selecionados no topo (em ordem alfabética), depois modelos não selecionados (em ordem alfabética)
      const sortedMatched = [...matched].sort((a, b) => {
        const aChecked = checkedModelIds.has(a) ? 1 : 0;
        const bChecked = checkedModelIds.has(b) ? 1 : 0;
        if (aChecked !== bChecked) return bChecked - aChecked;
        return a.localeCompare(b, undefined, { sensitivity: 'base' });
      });

      container.innerHTML = sortedMatched.map(id => {
        const isChecked = checkedModelIds.has(id);
        return `<label class="model-check-item ${isChecked ? 'checked' : ''}">
          <input type="checkbox" value="${escapeHtml(id)}" ${isChecked ? 'checked' : ''} data-model-id="${escapeHtml(id)}">
          <span style="flex: 1; word-break: break-all;">${escapeHtml(id)}</span>
        </label>`;
      }).join('');

      container.querySelectorAll('input[type="checkbox"]').forEach(chk => {
        chk.addEventListener('change', (e) => {
          const val = e.target.value;
          if (e.target.checked) {
            checkedModelIds.add(val);
          } else {
            checkedModelIds.delete(val);
          }
          renderFilteredModels();
        });
      });
    }

    async function loadModelsForChecklist(key, currentSettings) {
      const container = $('#modelsChecklistContainer');
      if (!container) return;

      const enabled = getEnabledModels(currentSettings);
      checkedModelIds = new Set(enabled);

      if (!key) {
        allDiscoveredModels = Array.from(new Set([...enabled]));
        allDiscoveredModels.sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));
        renderFilteredModels();
        return;
      }

      container.innerHTML = '<div style="padding: 12px; font-size: 13px; color: var(--muted); text-align: center;"><span class="balance-spinner" style="display:inline-block; margin-right:6px;"></span>Buscando modelos da sua conta OpenAI...</div>';

      const fetched = await fetchAvailableModels(key);
      if (fetched && fetched.length) {
        allDiscoveredModels = Array.from(new Set([...enabled, ...fetched]));
      } else {
        allDiscoveredModels = Array.from(new Set([...enabled]));
      }
      allDiscoveredModels.sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));

      renderFilteredModels();
    }

    function renderModelPopover() {
      const popoverList = $('#modelPopoverList');
      if (!popoverList) return;

      const settings = loadSettings();
      const enabled = [...getEnabledModels(settings)];
      enabled.sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));
      const active = getActiveModel(settings);

      if (!enabled.length) {
        popoverList.innerHTML = `<div style="padding: 16px 12px; font-size: 13px; color: var(--muted, #a0a0a0); text-align: center; line-height: 1.5;">
          <span>Nenhum modelo habilitado.</span><br>
          <button type="button" id="popoverGoSettingsBtn" style="background: transparent; border: none; color: var(--accent, #9de67a); font-size: 13px; font-weight: 500; text-decoration: underline; cursor: pointer; margin-top: 8px; font-family: inherit;">
            Habilitar nas Configurações
          </button>
        </div>`;
        $('#popoverGoSettingsBtn')?.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleModelPopover(false);
          openSettings();
        });
        return;
      }

      popoverList.innerHTML = enabled.map(m => {
        const isActive = m === active;
        return `<button type="button" class="model-popover-item ${isActive ? 'active' : ''}" data-model="${escapeHtml(m)}">
          <span>${escapeHtml(m)}</span>
          ${isActive ? '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>' : ''}
        </button>`;
      }).join('');

      popoverList.querySelectorAll('.model-popover-item').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const chosen = btn.getAttribute('data-model');
          if (chosen) {
            const cur = loadSettings();
            cur.model = chosen;
            cur.providerModels = cur.providerModels || {};
            cur.providerModels.openai = chosen;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(cur));
            updateActiveModelPill();
            renderModelPopover();
            toggleModelPopover(false);
            haptic('selection');
            notify('Modelo ativo: ' + chosen);
          }
        });
      });
    }

    function toggleModelPopover(forceState) {
      const pop = $('#modelPopover');
      const btn = $('#modelPillBtn');
      if (!pop) return;
      const isOpen = !pop.hidden;
      const nextState = forceState !== undefined ? forceState : !isOpen;
      pop.hidden = !nextState;
      if (btn) {
        if (nextState) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      }
      if (nextState) {
        renderModelPopover();
      }
    }
