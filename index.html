    function saveSettings(event) {
      if (event) {
        try { event.preventDefault(); event.stopPropagation(); } catch {}
      }
      try {
        const current = loadSettings();

        const typedKey = ($('#apiKeySetting')?.value || '').trim();
        const typedTransKey = ($('#transcriptionKeySetting')?.value || '').trim();
        const typedWebKey = ($('#webSearchKeySetting')?.value || '').trim();

        const effectiveKey = typedKey || current.apiKey || current.providerKeys?.openai || '';
        const effectiveGroqKey = typedTransKey || current.transcriptionKey || '';
        const effectiveWebKey = typedWebKey || current.webSearchKey || '';

        // Collect checked models
        const chosenModels = Array.from(checkedModelIds);
        let activeModel = current.model || '';
        if (chosenModels.length > 0) {
          if (!activeModel || !chosenModels.includes(activeModel)) {
            activeModel = chosenModels[0];
          }
        } else {
          activeModel = '';
        }

        const settings = {
          provider: 'openai',
          apiKey: effectiveKey,
          apiBase: 'https://api.openai.com/v1',
          model: activeModel,
          enabledModels: chosenModels,
          transcriptionKey: effectiveGroqKey,
          webSearchKey: effectiveWebKey,
          personality: ($('#personalitySetting')?.value || '').trim(),
          userName: ($('#userNameSetting')?.value || '').trim(),
          providerKeys: {
            openai: effectiveKey,
          },
          providerModels: {
            openai: activeModel,
          },
        };

        localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
        if ($('#apiKeySetting')) $('#apiKeySetting').value = '';
        if ($('#transcriptionKeySetting')) $('#transcriptionKeySetting').value = '';
        if ($('#webSearchKeySetting')) $('#webSearchKeySetting').value = '';

        applyIdentity();
        updateActiveModelPill();
        setSystemState('');
        if ($('#welcome')) showWelcome();
        closeDrawer();
        haptic('success');
        notify('Configurações salvas');
      } catch (err) {
        console.error('Erro ao salvar configurações:', err);
        notify('Erro ao salvar configurações');
      }
    }

    function resetSettings() {
      if (!confirm('Zerar todas as configurações? Isso apaga chaves, histórico e preferências salvas neste navegador.')) return;
      localStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem(STORAGE_CHATS_KEY);
      closeDrawer();
      closeHistoryDrawer();
      location.reload();
    }

    function autoResizePersonality() {
      const el = $('#personalitySetting');
      const refInput = $('#userNameSetting');
      if (!el) return;
      const baseH = (refInput && refInput.offsetHeight) ? refInput.offsetHeight : 44;
      el.style.height = 'auto';
      const newH = Math.min(Math.max(el.scrollHeight, baseH), 200);
      el.style.height = newH + 'px';
      el.style.overflowY = el.scrollHeight > 200 ? 'auto' : 'hidden';
    }

    function setupSettingsTabs() {
      document.querySelectorAll('[data-settings-tab]').forEach(button => button.addEventListener('click', () => {
        const target = button.dataset.settingsTab;
        document.querySelectorAll('[data-settings-tab]').forEach(item => item.classList.toggle('active', item === button));
        document.querySelectorAll('[data-settings-pane]').forEach(pane => pane.classList.toggle('active', pane.dataset.settingsPane === target));
        
        const actions = $('#modalActions');
        if (actions) {
          actions.style.display = (target === 'general' || target === 'preferences') ? 'flex' : 'none';
        }
        if (target === 'history') {
          renderHistoryList();
        }
        if (target === 'preferences') {
          setTimeout(autoResizePersonality, 30);
        }
        try { updateKeyFieldsVisibility(); } catch (e) {}
      }));

      $('#personalitySetting')?.addEventListener('input', autoResizePersonality);
    }

    function exportSettings() {
      saveCurrentChat();
      const settings = loadSettings();
      const chats = loadChatHistory();
      const prov = getActiveProviderConfig(settings);

      const enabledList = Array.isArray(settings.enabledModels) ? settings.enabledModels : [];
      const activeModel = getActiveModel(settings);

      const data = {
        version: 2,
        exportedAt: new Date().toISOString(),
        settings: {
          provider: 'openai',
          apiKey: getActiveApiKey(settings),
          apiBase: settings.apiBase || prov.apiBase,
          model: activeModel,
          enabledModels: enabledList,
          transcriptionKey: settings.transcriptionKey || '',
          webSearchKey: settings.webSearchKey || '',
          userName: settings.userName || '',
          personality: settings.personality || '',
          providerKeys: settings.providerKeys || {},
          providerModels: settings.providerModels || {},
        },
        provider: 'openai',
        apiKey: getActiveApiKey(settings),
        apiBase: settings.apiBase || prov.apiBase,
        model: activeModel,
        enabledModels: enabledList,
        transcriptionKey: settings.transcriptionKey || '',
        webSearchKey: settings.webSearchKey || '',
        userName: settings.userName || '',
        personality: settings.personality || '',
        providerKeys: settings.providerKeys || {},
        providerModels: settings.providerModels || {},
        chats: chats,
        history: chats,
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const filename = 'aion-backup.json';
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 300);
      haptic('success');
      const count = (chats || []).length;
      notify(`Backup exportado (${count} ${count === 1 ? 'conversa' : 'conversas'})`);
    }

    function importSettings() {
      let input = $('#importFile');
      if (!input) {
        input = document.createElement('input');
        input.type = 'file';
        input.id = 'importFile';
        input.accept = '.json,application/json';
        input.style.display = 'none';
        document.body.appendChild(input);
        input.addEventListener('change', handleImport);
      }
      input.value = '';
      input.click();
    }

    function handleImport(event) {
      const file = event?.target?.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const raw = JSON.parse(reader.result);
          const s = raw.settings || raw;
          const current = loadSettings();

          const directKey = s.apiKey || (typeof raw.apiKey === 'string' ? raw.apiKey : '') || current.apiKey || '';
          const transKey = s.transcriptionKey || (typeof raw.transcriptionKey === 'string' ? raw.transcriptionKey : '') || current.transcriptionKey || '';
          const webKey = s.webSearchKey || (typeof raw.webSearchKey === 'string' ? raw.webSearchKey : '') || current.webSearchKey || '';

          const chosenModel = s.model || (typeof raw.model === 'string' ? raw.model : '') || current.model || '';
          
          let enabledList = [];
          if (Array.isArray(s.enabledModels) && s.enabledModels.length > 0) {
            enabledList = s.enabledModels;
          } else if (Array.isArray(raw.enabledModels) && raw.enabledModels.length > 0) {
            enabledList = raw.enabledModels;
          } else if (chosenModel) {
            enabledList = [chosenModel];
          }

          const updatedSettings = {
            provider: 'openai',
            apiKey: directKey,
            apiBase: 'https://api.openai.com/v1',
            model: chosenModel,
            enabledModels: enabledList,
            transcriptionKey: transKey,
            webSearchKey: webKey,
            personality: s.personality !== undefined ? s.personality : (raw.personality !== undefined ? raw.personality : (current.personality || '')),
            userName: s.userName !== undefined ? s.userName : (raw.userName !== undefined ? raw.userName : (current.userName || '')),
            providerKeys: { openai: directKey },
            providerModels: { openai: chosenModel },
          };

          localStorage.setItem(STORAGE_KEY, JSON.stringify(updatedSettings));

          // Atualiza inputs visuais
          if ($('#personalitySetting')) $('#personalitySetting').value = updatedSettings.personality;
          if ($('#userNameSetting')) $('#userNameSetting').value = updatedSettings.userName;
          if ($('#apiKeySetting')) $('#apiKeySetting').value = '';
          if ($('#transcriptionKeySetting')) $('#transcriptionKeySetting').value = '';
          if ($('#webSearchKeySetting')) $('#webSearchKeySetting').value = '';

          // Atualiza estado dos modelos
          checkedModelIds = new Set(enabledList);
          allDiscoveredModels = Array.from(new Set([...enabledList]));
          allDiscoveredModels.sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));
          renderFilteredModels();

          applyIdentity();
          updateActiveModelPill();
          renderModelPopover();

          const importedChats = Array.isArray(raw.chats) ? raw.chats : (Array.isArray(raw.history) ? raw.history : null);
          let chatsCount = 0;
          if (importedChats && importedChats.length > 0) {
            saveChatHistory(importedChats);
            chatsCount = importedChats.length;
            renderHistoryList();
            const firstChat = importedChats[0];
            if (firstChat && firstChat.id) {
              openChat(firstChat.id);
            }
          } else {
            showWelcome();
          }

          setSystemState(isDisconnected() ? 'disconnected' : '');

          const msg = chatsCount > 0
            ? `Backup restaurado com sucesso (${chatsCount} ${chatsCount === 1 ? 'conversa' : 'conversas'})`
            : 'Backup restaurado com sucesso';
          haptic('success');
          notify(msg);
          closeDrawer();
        } catch (err) {
          console.error('Erro no handleImport:', err);
          notify('Arquivo de backup inválido ou corrompido');
        }
      };
      reader.readAsText(file);
      try { event.target.value = ''; } catch {}
    }

    function getGroqKey(settings) {
      const s = settings || loadSettings();
      return (s.transcriptionKey || s.providerKeys?.groq || s.providerKeys?.['https://api.groq.com/openai/v1'] || '').trim();
    }

    function setupMicrophone() {
      const micButton = $('#micButton');
      if (!micButton || micButton.dataset.bound) return;
      micButton.dataset.bound = 'true';

      let recording = false;
      let stream = null;
      let audioContext = null;
      let processor = null;
      let source = null;
      let chunks = [];
      let sampleRate = 16000;

      function wavBlob(buffers, rate) {
        const length = buffers.reduce((acc, b) => acc + b.length, 0);
        const buffer = new ArrayBuffer(44 + length * 2);
        const view = new DataView(buffer);
        const write = (offset, string) => {
          for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i));
        };
        write(0, 'RIFF'); view.setUint32(4, 36 + length * 2, true); write(8, 'WAVE');
        write(12, 'fmt ');
        view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
        view.setUint32(24, rate, true); view.setUint32(28, rate * 2, true); view.setUint16(32, 2, true);
        view.setUint16(34, 16, true); write(36, 'data'); view.setUint32(40, length * 2, true);
        let offset = 44;
        buffers.forEach(part => part.forEach(sample => {
          const value = Math.max(-1, Math.min(1, sample));
          view.setInt16(offset, value < 0 ? value * 0x8000 : value * 0x7fff, true); offset += 2;
        }));
        return new Blob([buffer], { type: 'audio/wav' });
      }

      async function startRecording() {
        if (isDisconnected()) {
          shakeInterface();
          return;
        }
        if (recording) return;
        try {
          stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
          sampleRate = audioContext.sampleRate;
          source = audioContext.createMediaStreamSource(stream);
          processor = audioContext.createScriptProcessor(4096, 1, 1);
          chunks = [];
          recording = true;
          processor.onaudioprocess = event => {
            if (!recording) return;
            chunks.push(new Float32Array(event.inputBuffer.getChannelData(0)));
          };
          source.connect(processor);
          processor.connect(audioContext.destination);
          haptic('light');
          micButton.classList.add('listening');
          micButton.setAttribute('aria-label', 'Parar de ouvir');
          setSystemState('listening');
        } catch (err) {
          recording = false;
          micButton.classList.remove('listening');
          micButton.setAttribute('aria-label', 'Falar');
          setSystemState('');
          console.error('Erro ao acessar microfone:', err);
          notify('Não foi possível acessar seu microfone');
        }
      }

      async function stopRecording(andSend = false) {
        if (!recording) {
          if (andSend) sendMessage();
          return;
        }
        haptic('light');
        recording = false;
        processor?.disconnect();
        source?.disconnect();
        stream?.getTracks().forEach(track => track.stop());
        const recorded = chunks;
        const rate = sampleRate;
        micButton.classList.remove('listening');
        micButton.setAttribute('aria-label', 'Falar');
        if (audioContext) await audioContext.close().catch(() => {});
        audioContext = null;
        if (!recorded.length) {
          setSystemState('');
          if (andSend) sendMessage();
          return;
        }
        const key = getGroqKey();
        if (!key) {
          notify('Configure sua chave da Groq nas Configurações para transcrição por voz');
          setSystemState('');
          if (andSend) sendMessage();
          return;
        }
        setSystemState('transcribing');
        const audio = wavBlob(recorded, rate);
        try {
          const form = new FormData();
          form.append('file', audio, 'fala.wav');
          form.append('model', 'whisper-large-v3-turbo');
          form.append('language', 'pt');
          form.append('response_format', 'json');
          const response = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + key },
            body: form,
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(data.error?.message || 'Serviço de transcrição indisponível');
          const transcript = (data.text || '').trim();
          if (transcript) {
            els.input.value = [els.input.value.trim(), transcript].filter(Boolean).join(' ');
            autoResize();
            updateSendButtonState();
          } else {
            notify('Não consegui entender sua fala');
          }
        } catch (err) {
          console.error('Erro na transcrição Groq:', err);
          notify(err.message || 'Erro ao transcrever áudio');
        } finally {
          setSystemState('');
          if (andSend) sendMessage();
        }
      }

      window.voiceController = {
        isActive: () => recording,
        stopAndSend: () => stopRecording(true)
      };

      micButton.addEventListener('click', (e) => {
        if (isDisconnected()) {
          e.preventDefault();
          shakeInterface();
          return;
        }
        if (recording) {
          stopRecording(false);
        } else {
          startRecording();
        }
      });

      window.stopVoiceInput = (andSend) => {
        if (recording) stopRecording(andSend);
      };
    }

    function bindEvents() {
      $('#sendButton')?.addEventListener('click', (e) => {
        if (isDisconnected()) {
          e.preventDefault();
          shakeInterface();
          return;
        }
        if (window.voiceController && window.voiceController.isActive()) {
          e.preventDefault();
          window.voiceController.stopAndSend();
          return;
        }
        if (busy) {
          e.preventDefault();
          if (abortController) {
            abortController.abort();
          } else {
            finishResponse();
          }
          notify('Resposta interrompida');
          return;
        }
        sendMessage();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && busy) {
          if (abortController) {
            abortController.abort();
          } else {
            finishResponse();
          }
          notify('Resposta interrompida');
        }
      });
      els.input?.addEventListener('input', () => {
        if (isDisconnected()) {
          els.input.value = '';
          shakeInterface();
          return;
        }
        autoResize();
        updateSendButtonState();
      });
      els.input?.addEventListener('keyup', updateSendButtonState);
      els.input?.addEventListener('paste', () => setTimeout(updateSendButtonState, 0));
      els.input?.addEventListener('keydown', event => {
        if (isDisconnected()) {
          event.preventDefault();
          shakeInterface();
          return;
        }
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          if (window.voiceController && window.voiceController.isActive()) {
            window.voiceController.stopAndSend();
            return;
          }
          sendMessage();
        }
      });
      els.input?.addEventListener('mousedown', e => {
        if (isDisconnected()) {
          e.preventDefault();
          els.input.blur();
          shakeInterface();
        }
      });
      els.input?.addEventListener('click', e => {
        if (isDisconnected()) {
          e.preventDefault();
          els.input.blur();
          shakeInterface();
        }
      });
      els.input?.addEventListener('focus', e => {
        if (isDisconnected()) {
          e.preventDefault();
          els.input.blur();
          shakeInterface();
        }
      });
      $('#toggleHistory')?.addEventListener('click', openHistoryDrawer);
      $('#closeHistory')?.addEventListener('click', closeHistoryDrawer);
      $('#drawerNewChat')?.addEventListener('click', startNewChat);
      $('#historySearch')?.addEventListener('input', e => renderHistoryList(e.target.value));
      $('#clearAllHistory')?.addEventListener('click', clearAllHistory);
      $('#historyList')?.addEventListener('click', e => {
        const deleteBtn = e.target.closest('[data-delete-chat]');
        if (deleteBtn) {
          deleteChat(deleteBtn.dataset.deleteChat, e);
          return;
        }
        const item = e.target.closest('[data-chat-id]');
        if (item) {
          openChat(item.dataset.chatId);
        }
      });
      $('#openSettings')?.addEventListener('click', openSettings);
      $('#settingsForm')?.addEventListener('submit', saveSettings);
      $('#saveSettingsBtn')?.addEventListener('click', saveSettings);
      $('#saveSettingsBtn')?.addEventListener('click', saveSettings);
      $('#closeSettings')?.addEventListener('click', closeDrawer);
      $('#cancelSettings')?.addEventListener('click', closeDrawer);
      $('#drawerBackdrop')?.addEventListener('click', () => {
        closeDrawer();
        closeHistoryDrawer();
      });
      document.querySelectorAll('[data-export]').forEach(button => button.addEventListener('click', exportSettings));
      document.querySelectorAll('[data-import]').forEach(button => button.addEventListener('click', importSettings));
      $('#importFile')?.addEventListener('change', handleImport);
      $('#resetSettings')?.addEventListener('click', resetSettings);
      $('#modelFilterInput')?.addEventListener('input', () => renderFilteredModels());
      $('#modelPillBtn')?.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleModelPopover();
      });
      document.addEventListener('click', (e) => {
        if (!e.target.closest('.model-picker-wrapper')) {
          toggleModelPopover(false);
        }
      });
      $('#modelFilterInput')?.addEventListener('input', () => {
        renderFilteredModels();
      });
      $('#providerSetting')?.addEventListener('change', e => {
        const provId = e.target.value;
        const current = loadSettings();
        updateProviderUI(provId, current);
      });
      $('#apiKeySetting')?.addEventListener('input', () => {
        const provId = $('#providerSetting')?.value || 'openai';
        const typedKey = $('#apiKeySetting').value.trim();
        const settings = loadSettings();
        const savedKey = getSavedKeyForProvider(settings, provId);
        const effectiveKey = typedKey || savedKey;
        clearTimeout(liveModelTimer);
        liveModelTimer = setTimeout(() => {
          loadModelsForProvider(provId, effectiveKey, $('#modelSetting')?.value || settings.model);
          loadBalanceForProvider(provId, effectiveKey);
        }, 400);
      });
      $('#refreshBalanceBtn')?.addEventListener('click', async () => {
        const btn = $('#refreshBalanceBtn');
        btn?.classList.add('rotating');
        const provId = $('#providerSetting')?.value || 'openai';
        const settings = loadSettings();
        const typedKey = $('#apiKeySetting')?.value.trim();
        const savedKey = getSavedKeyForProvider(settings, provId);
        const key = typedKey || savedKey;
        await loadBalanceForProvider(provId, key);
        btn?.classList.remove('rotating');
      });
      $('#attachButton')?.addEventListener('click', (e) => {
        if (isDisconnected()) {
          e.preventDefault();
          shakeInterface();
          return;
        }
        $('#attachFile')?.click();
      });
      $('#attachFile')?.addEventListener('change', event => { handleFiles(event.target.files); event.target.value = ''; });
      $('#attachments')?.addEventListener('click', event => {
        const button = event.target.closest('.chip-remove');
        if (!button) return;
        attachments.splice(Number(button.dataset.index), 1);
        renderAttachmentPreview();
      });
      els.messages?.addEventListener('click', handleMessageClicks);

      // Suporte para Ctrl+V (colar imagens e arquivos da área de transferência)
      window.addEventListener('paste', handlePaste);

      // Suporte para arrastar e soltar arquivos (Drag & Drop)
      window.addEventListener('dragover', e => e.preventDefault());
      window.addEventListener('drop', e => {
        e.preventDefault();
        if (isDisconnected()) {
          shakeInterface();
          return;
        }
        if (e.dataTransfer?.files?.length) {
          handleFiles(e.dataTransfer.files);
        }
      });
    }

    function handlePaste(event) {
      const clipboardData = event.clipboardData || window.clipboardData;
      if (!clipboardData) return;

      const items = Array.from(clipboardData.items || []);
      const files = [];

      for (const item of items) {
        if (item.kind === 'file') {
          const file = item.getAsFile();
          if (file) {
            let name = file.name;
            if (!name || name === 'image.png' || name === 'blob') {
              const now = new Date();
              const timeStr = `${now.getHours().toString().padStart(2, '0')}${now.getMinutes().toString().padStart(2, '0')}${now.getSeconds().toString().padStart(2, '0')}`;
              name = `imagem_colada_${timeStr}.png`;
            }
            const mime = file.type || (name.endsWith('.png') ? 'image/png' : 'image/jpeg');
            const namedFile = new File([file], name, { type: mime });
            files.push(namedFile);
          }
        }
      }

      // Se houver arquivo ou imagem colada na área de transferência
      if (files.length > 0) {
        event.preventDefault();
        if (isDisconnected()) {
          shakeInterface();
          return;
        }
        handleFiles(files);
        return;
      }

      // Se for texto normal colado
      const target = event.target;
      if (target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.isContentEditable)) {
        if (target === els.input && isDisconnected()) {
          event.preventDefault();
          shakeInterface();
          return;
        }
        // Permite colagem padrão de texto
        return;
      }

      if (isDisconnected()) {
        event.preventDefault();
        shakeInterface();
      }
    }

    
    window.openSettings = openSettings;
    window.closeDrawer = closeDrawer;
    window.openHistoryDrawer = openHistoryDrawer;
    window.closeHistoryDrawer = closeHistoryDrawer;
    window.startNewChat = startNewChat;
    window.sendMessage = sendMessage;
    window.exportSettings = exportSettings;
    window.importSettings = importSettings;
    window.resetSettings = resetSettings;
    
    function init() {
      try {
        const onAppResume = () => {
          try {
            const settings = loadSettings();
            document.title = 'Aion';
            if (!busy) {
              updateSendButtonState();
              if (els.input) autoResize();
            }
          } catch {}
        };
        window.addEventListener('focus', onAppResume);
        window.addEventListener('pageshow', onAppResume);
        document.addEventListener('visibilitychange', () => {
          if (!document.hidden) onAppResume();
        }); bindEvents(); } catch (e) { console.error('bindEvents error:', e); }
      try { setupSettingsTabs(); } catch (e) { console.error('setupSettingsTabs error:', e); }
      try { setupMicrophone(); } catch (e) { console.error('setupMicrophone error:', e); }
      try { applyTheme(); } catch (e) { console.error('applyTheme error:', e); }
      try { applyIdentity(); } catch (e) { console.error('applyIdentity error:', e); }
      try { updateKeyFieldsVisibility(); } catch (e) { console.error('updateKeyFieldsVisibility error:', e); }
      try { updateActiveModelPill(); } catch (e) { console.error('updateActiveModelPill error:', e); }
      try { renderModelPopover(); } catch (e) { console.error('renderModelPopover error:', e); }
      try { renderHistoryList(); } catch (e) { console.error('renderHistoryList error:', e); }
      try { showWelcome(); } catch (e) { console.error('showWelcome error:', e); }
      try { setSystemState(''); } catch (e) {}
      try { setupMarkedRenderer(); } catch (e) { console.error('setupMarkedRenderer error:', e); }
      try { setupViewportHeight();
      setupScrollListeners(); } catch (e) { console.error('setupViewportHeight error:', e); }
      try { setupMobileComposerPadding(); } catch (e) { console.error('setupMobileComposerPadding error:', e); }
      try { if (els.input) els.input.focus(); } catch (e) {}
      try { updateSendButtonState(); } catch(e) {}
    }

    init();
  
  
  
  
  
  
  
  
  
  </script>
